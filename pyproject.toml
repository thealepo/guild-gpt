[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guildgpt"
version = "0.1.0"
description = "A from-scratch JAX/Flax NNX GPT trained on WritingPrompts"
requires-python = ">=3.11,<3.13"
dependencies = [
  "jax==0.7.2", "flax==0.12.0", "optax==0.2.6", "orbax-checkpoint==0.11.25",
  "numpy==2.5.4", "PyYAML==6.0.3", "datasets==4.8.5",
  "transformers==4.57.6", "huggingface-hub==0.36.2",
  "safetensors==0.8.0", "wandb==0.31.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.5"]
cuda = ["jax-cuda12-plugin[with-cuda]==0.7.2", "jax-cuda12-pjrt==0.7.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks/prototype_archive.ipynb"]
